project:
  type: book

# University PDF templates mapping — custom field for this project.
# We store available university templates here; this is a convenience mapping for humans
# and scripts. Quarto itself does not automatically use this mapping, but you can
# reference the template path in individual documents as shown in examples/montclair-dissertation.qmd.

university_formats:
  montclair: formats/montclair.tex

# Example: to render the example Quarto document to PDF using the Montclair template:
# quarto render examples/montclair-dissertation.qmd
# (The document already declares the template under format: pdf: template: formats/montclair.tex)

# Future: you can write a small build script or Makefile target that selects a template
# by name from this mapping and renders documents accordingly.
